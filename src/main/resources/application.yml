server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

spring:
  application:
    name: dispatch-load-balancer
  datasource:
    url: jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
